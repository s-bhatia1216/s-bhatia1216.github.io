        *Undergraduate Researcher, PI: Prof. Radhika Nagpal · Aug 2026 to Dec 2026 · Princeton, NJ*

        - Building a fleet of 6 to 10 Tumblenauts microgravity inspection robots alongside a PhD student, developing motion planning and ML-based autonomy software ahead of a ZeroG parabolic flight test in November 2026.
    - bullet: |
        **Beeson Group, Princeton University**<br>
        *Undergraduate Researcher, Advisor: Prof. Ryne Beeson · Aug 2026 to Dec 2026 · Princeton, NJ*

        - Researching physics-informed neural network (PINN) methods for tropical cyclone vortex initialization, extending an existing forecasting framework.
        - Training the PINN to jointly satisfy observational fit and the governing vortex dynamics equations, embedding physical constraints directly into the loss function to improve initialization accuracy over purely data-driven baselines.
    - bullet: |
        **Senior Thesis, Department of Mechanical & Aerospace Engineering, Robotics**<br>
        *Advisor: Prof. Ryne Beeson; Reader: Prof. Christine Allen-Blanchette · Aug 2025 to Apr 2026 · Princeton, NJ*

        - Thesis: *Multi-Particle Control for Nonlinear Data Assimilation in Chaotic Systems* (189 pages, April 2026).
        - Developed an imitation-learning framework that amortizes the cost of optimal particle-filter nudging offline: a Feynman-Kac Monte Carlo oracle generates expert controls across a low-discrepancy sample of the chaotic attractor, with Girsanov-Radon-Nikodym corrections applied along each trajectory to preserve importance-sampling validity.
        - Trained a neural network via behavioral cloning to imitate the oracle's per-particle control policy, replacing expensive online Monte Carlo rollouts with a single forward pass at deployment; evaluated four model variants: a per-particle regression baseline, two DeepSets ensemble-aware controllers with weight-aware pooling, and a residual architecture initialized from the per-particle checkpoint.
        - On Lorenz-63, the per-particle controller achieved a **77% reduction** in normalized RMSE relative to the uncontrolled particle filter and a 4× improvement over the oracle-nudged particle filter, at 70% lower computational cost.
        - Demonstrated scaling to Lorenz-96 (K = 8 state variables) with no architectural changes, matching oracle accuracy while maintaining higher normalized effective sample size at 27% lower cost.
    - bullet: |
        **Junior Independent Work, Princeton University**<br>
        *Advisor: Prof. Ryne Beeson; Readers: Profs. Kolemen & Rowley · May 2024 to Jan 2026 · Princeton, NJ*

        - IW F25: *Learning Particle-Wise Control for Nonlinear Data Assimilation: From Diffusion Models to Supervised Regression* (86 pages, January 2026).
        - Conducted a systematic comparison of diffusion-based and regression-based learned control for particle filtering, identifying a structural mismatch between generative models and importance sampling.
        - Built a supervised regression framework that learns a deterministic mapping from particle state, observation, and time-to-observation to HJB-inspired nudging control, using a scalable dataset sampled from the Lorenz-63 attractor.
        - IW F24: *Optimal Control in the Filtering of Chaotic Systems Using Adaptive ML Algorithms* (37 pages, January 2025), establishing the HJB-based control formulation and baseline comparisons as groundwork for the thesis.
